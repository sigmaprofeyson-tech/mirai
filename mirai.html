<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MİRAİ - Link Tree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #050505; 
        }

        #bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('background.gif'); 
            background-size: cover; 
            background-position: center;
            z-index: 1; 
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2;
        }

        #canvas {
            position: fixed; top: 0; left: 0;
            z-index: 3; 
            pointer-events: none; 
        }

        #snowCanvas {
            position: fixed; top: 0; left: 0;
            z-index: 4;
            pointer-events: none;
        }

        .center-wrapper {
            position: absolute; top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 5;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(160, 32, 240, 0.05);
        }

        .glass-container {
            width: 100%; padding: 40px 25px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        .profile-wrapper {
            position: relative; width: 110px; height: 110px; margin-bottom: 15px;
            border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, #a020f0, #ff00ff);
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.5);
        }
        .profile-wrapper img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
        }

        .username {
            color: #fff; font-size: 1.3rem; font-weight: 800;
            margin-bottom: 30px; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(160, 32, 240, 1);
        }

        .social-link {
            display: flex; align-items: center;
            width: 100%; padding: 15px 20px; margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px; color: white;
            text-decoration: none; font-weight: bold; letter-spacing: 1px;
            box-sizing: border-box; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }

        .social-link i { font-size: 24px; width: 40px; text-align: center; }

        .social-link::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s;
        }

        .social-link:hover:not(.disabled) {
            background: rgba(160, 32, 240, 0.15); border-color: rgba(160, 32, 240, 0.5);
            transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 25px rgba(160, 32, 240, 0.4);
        }

        .social-link:hover:not(.disabled)::before { left: 100%; }

        .disabled { opacity: 0.4; cursor: not-allowed; }
        .disabled:hover { border-color: rgba(255, 0, 0, 0.2); }

        .music-player {
            width: 100%; padding: 15px 20px; box-sizing: border-box;
            display: flex; align-items: center; gap: 15px;
            border-radius: 20px;
        }

        .play-btn {
            background: rgba(160, 32, 240, 0.2);
            border: 1px solid rgba(160, 32, 240, 0.5);
            color: white; width: 45px; height: 45px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 16px; transition: all 0.3s;
            box-shadow: 0 0 10px rgba(160, 32, 240, 0.3);
            flex-shrink: 0;
        }

        .play-btn:hover {
            background: rgba(160, 32, 240, 0.6);
            transform: scale(1.1);
        }

        .music-info {
            display: flex; flex-direction: column; width: 100%; gap: 8px;
            overflow: hidden;
        }

        .song-name-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .song-name {
            display: inline-block;
            color: #fff; 
            font-size: 0.85rem; 
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            white-space: nowrap;
            animation: neonScroll 8s linear infinite;
            text-shadow: 
                0 0 5px #a020f0,
                0 0 10px #a020f0,
                0 0 20px #a020f0,
                0 0 40px #a020f0;
            padding-left: 100%;
        }

        @keyframes neonScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(255, 255, 255, 0.2); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 12px; width: 12px; border-radius: 50%;
            background: #a020f0; cursor: pointer;
            -webkit-appearance: none; margin-top: -4px;
            box-shadow: 0 0 10px #a020f0; transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
    </style>
<base target="_blank">
</head>
<body>

    <div id="bg-image"></div>
    <div id="overlay"></div>
    <canvas id="canvas"></canvas>
    <canvas id="snowCanvas"></canvas>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="center-wrapper">
        <div class="glass-panel glass-container">
            <div class="profile-wrapper">
                <img src="profile.jpg" alt="Profile" id="profileImg" onerror="this.src='https://via.placeholder.com/150/111/fff?text=MIRAI'">
            </div>
            <div class="username">@MİRAİ</div>

            <a href="https://tiktok.com/@mirai.vl" target="_blank" class="social-link">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://instagram.com/mirai.vl" target="_blank" class="social-link">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://youtube.com/@miraivl" target="_blank" class="social-link">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://tracker.gg/valorant/profile/riot/Mirai%23144hz/overview" target="_blank" class="social-link">
                <i class="fas fa-crosshairs"></i> Valorant Tracker
            </a>
            <div class="social-link disabled">
                <i class="fab fa-discord"></i> Discord (Yakında)
            </div>
        </div>

        <div class="glass-panel music-player">
            <button class="play-btn" id="playBtn">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
            <div class="music-info">
                <div class="song-name-wrapper">
                    <div class="song-name" id="songDisplay">Farazi V Kayra - Bir fotoğrafın rüyası</div>
                </div>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>
    </div>

    <script>
        // Müzik Oynatıcı
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const songDisplay = document.getElementById('songDisplay');

        audio.volume = volumeSlider.value;

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                songDisplay.style.textShadow = '0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff';
                songDisplay.style.color = '#ffb3ff';
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                songDisplay.style.textShadow = '0 0 5px #a020f0, 0 0 10px #a020f0, 0 0 20px #a020f0, 0 0 40px #a020f0';
                songDisplay.style.color = '#fff';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // ==========================================
        // KAR YAĞIŞI EFEKTİ
        // ==========================================
        const snowCanvas = document.getElementById('snowCanvas');
        const sCtx = snowCanvas.getContext('2d');
        let snowflakes = [];

        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSnow);
        resizeSnow();

        class Snowflake {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * snowCanvas.width;
                this.y = initial ? Math.random() * snowCanvas.height : -10;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.sway = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.sway += this.swaySpeed;
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.sway) * 0.5;

                // Ekran dışına çıkınca tekrar başa al (birikme yok)
                if (this.y > snowCanvas.height + 10) {
                    this.reset();
                }
                if (this.x > snowCanvas.width + 10) {
                    this.x = -10;
                } else if (this.x < -10) {
                    this.x = snowCanvas.width + 10;
                }
            }

            draw() {
                sCtx.save();
                sCtx.globalAlpha = this.opacity;
                sCtx.fillStyle = '#ffffff';
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                sCtx.fill();

                // Hafif glow
                sCtx.shadowBlur = 8;
                sCtx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();
            }
        }

        function initSnow() {
            snowflakes = [];
            const count = Math.min(Math.floor(window.innerWidth / 12), 120);
            for(let i = 0; i < count; i++) snowflakes.push(new Snowflake());
        }

        function animateSnow() {
            sCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            snowflakes.forEach(f => {
                f.update();
                f.draw();
            });
            requestAnimationFrame(animateSnow);
        }

        initSnow();
        animateSnow();

        // ==========================================
        // MİRAİ KAPALI MOR PARÇACIK SİSTEMİ
        // ==========================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        let particles = [];
        let mouse = { x: -1000, y: -1000, radius: 120 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = -1000; mouse.y = -1000; });

        const koyuMorTonlari = [
            'rgba(75, 0, 130, 0.9)',      // Indigo
            'rgba(106, 13, 173, 0.9)',    // Mor
            'rgba(85, 0, 130, 0.9)',      // Koyu mor
            'rgba(128, 0, 128, 0.85)',    // Purple
            'rgba(102, 51, 153, 0.9)',    // Rebecca Purple
            'rgba(139, 0, 139, 0.85)',    // Dark Magenta
            'rgba(148, 0, 211, 0.85)',    // Dark Violet
            'rgba(153, 50, 204, 0.85)'    // Dark Orchid
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.baseX = x; this.baseY = y;
                this.size = Math.random() * 2.5 + 1.8;
                this.color = color;
                this.density = (Math.random() * 20) + 5;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let force = (mouse.radius - distance) / mouse.radius;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;
                    this.x -= directionX; 
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) { this.x -= (this.x - this.baseX) / 15; }
                    if (this.y !== this.baseY) { this.y -= (this.y - this.baseY) / 15; }
                }
            }
        }

        function init() {
            particles = [];
            const text = "MİRAİ";
            ctx.fillStyle = 'white';
            let fontSize = Math.min(w / 4, 150);
            ctx.font = '900 ' + fontSize + 'px sans-serif';
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.fillText(text, w / 2, h * 0.12); 

            const textCoordinates = ctx.getImageData(0, 0, w, h);
            ctx.clearRect(0, 0, w, h);

            for (let y = 0; y < textCoordinates.height; y += 6) {
                for (let x = 0; x < textCoordinates.width; x += 6) {
                    if (textCoordinates.data[(y * 4 * textCoordinates.width) + (x * 4) + 3] > 128) {
                        let color = koyuMorTonlari[Math.floor(Math.random() * koyuMorTonlari.length)];
                        particles.push(new Particle(x, y, color));
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        setTimeout(() => {
            init();
            animate();
        }, 100);

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
